# Default values for tolid-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

tolcore:
  app:
    name: tolid

  replicaCount: 1

  image:
    repository: ""
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "serviceaccount"

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  job:
    restartPolicy: "OnFailure"

  deployment:
    environment: "dev"
  db:
    fullname: "tolid-db"
    user: ""
    password: ""
    name: ""
    host: ""
    port: "" # specify as a string
    enabled: true
  schemaspy:
    enabled: false
  apiv2:
    fullname: "tolid-apiv2"
    probe_url: '/api/v2/ui'
    path: '/api/v2'
    extra_env:
      MAIL_USERNAME_SMTP: mail.username
      MAIL_PASSWORD_SMTP: mail.password
      MAIL_HOST: mail.host
      MAIL_PORT: mail.port
      MAIL_SENDER: mail.sender.address
      MAIL_SENDER_NAME: mail.sender.name
      MAIL_RECEIVER_REQUESTS_PENDING: mail.receiver.requests_pending
      TOLID_URL: public_url.tolid
      NIH_API_KEY: keys.nih
      GOAT_URL: goat.url
      GOAT_API_PATH: goat.api_path
  api:
    fullname: "tolid-api"
    probe_url: '/api/v3/system/healthz'
    path: '/api/v3'
    auth_path: '/auth'
    data_path: ''
    custom_path: ''
    system_path: '/system'
    auth_path: '/auth'
    extra_env:
      MAIL_USERNAME_SMTP: mail.username
      MAIL_PASSWORD_SMTP: mail.password
      MAIL_HOST: mail.host
      MAIL_PORT: mail.port
      MAIL_SENDER: mail.sender.address
      MAIL_SENDER_NAME: mail.sender.name
      MAIL_RECEIVER_REQUESTS_PENDING: mail.receiver.requests_pending
      TOLID_URL: public_url.tolid
      API_PATH: api.path
      API_DATA_PATH: api.data_path
      API_AUTH_PATH: api.auth_path
      API_CUSTOM_PATH: api.custom_path
      API_SYSTEM_PATH: api.system_path
      API_AUTH_PATH: api.auth_path
      GOAT_URL: goat.url
      GOAT_API_PATH: goat.api_path
  flask:
    env: ""
  ui:
    fullname: "tolid-ui"
    probe_url: '/'
    extra_env:
      REACT_APP_API_PATH: api.path
      REACT_APP_API_DATA_PATH: api.data_path
      REACT_APP_AUTH_API_DATA_PATH: api.auth_path
      REACT_APP_API_CUSTOM_PATH: api.custom_path
      REACT_APP_PORTAL_URL: portal.url
      REACT_APP_PORTAL_API_PATH: portal.api_path
      REACT_APP_PORTAL_API_DATA_PATH: portal.api_data_path
      REACT_APP_BOARDS_API_DATA_PATH: portal.boards_api_data_path
  backup:
    uri: ""
    access_key: ""
    secret_key: ""
    bucket: ""
    secure: ""
    schedule: ""
  restore:
    prefix: ""
  mail:
    username: ""
    password: ""
    host: ""
    port: ""
    sender:
      address: ""
      name: ""
    receiver:
      requests_pending: ""
  public_url:
    tolid: ""
  keys:
    nih: ""
  elixir:
    client:
      id: ""
      secret: ""
    url:
      redirect: ""
    jwk: ""
  portal:
    url: https://portal.tol.sanger.ac.uk
    api_path: /api/v1
    api_data_path: /data
    boards_api_data_path: /boards
  goat:
    url: https://goat.genomehubs.org
    api_path: /api/v2
  oidc:
    enabled: true
    client:
      id: ""
      secret: ""
    url:
      auth: https://login.aai.lifescience-ri.eu/oidc/authorize
      token: https://login.aai.lifescience-ri.eu/oidc/token
      revoke: https://login.aai.lifescience-ri.eu/oidc/revoke
      userinfo: https://login.aai.lifescience-ri.eu/oidc/userinfo
