# This is used for local development only
version: '3.1'

services:
  tolid-db:
    image: postgres:14
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5433:5432"

  tolid-api:
    build: 
      context: tolid-api
      dockerfile: Dockerfile.dev
    environment:
      - DB_URI
      - TOLID_URL
      - GOAT_URL
      - GOAT_API_PATH
      - MAIL_SENDER
      - MAIL_SENDER_NAME
      - MAIL_USERNAME_SMTP
      - MAIL_PASSWORD_SMTP
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_RECEIVER_REQUESTS_PENDING
      - ENVIRONMENT
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_REDIRECT_URI
      - OIDC_AUTH_URL
      - OIDC_USER_INFO_URL
      - OIDC_TOKEN_URL
      - OIDC_REVOKE_TOKEN_URL
      - API_PATH
      - API_DATA_PATH
      - API_CUSTOM_PATH
      - API_SYSTEM_PATH
      - API_AUTH_PATH
    ports:
      - "8080:80"
    volumes:
      - './tolid-api/app/main:/app/main'
      - '../tol-sdk:/packages/tol-sdk:rw'
    depends_on:
      - tolid-apiv2

  tolid-apiv2:
    build: 
      context: tolid-apiv2/.
      dockerfile: Dockerfile.dev
    environment:
      - DB_URI
      - TOLID_URL
      - ELIXIR_CLIENT_ID
      - ELIXIR_CLIENT_SECRET
      - ELIXIR_REDIRECT_URI
      - ELIXIR_JWK
      - MAIL_SENDER
      - MAIL_SENDER_NAME
      - MAIL_USERNAME_SMTP
      - MAIL_PASSWORD_SMTP
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_RECEIVER_REQUESTS_PENDING
      - ENVIRONMENT
    ports:
      - "8081:80"
    volumes:
      - './tolid-apiv2/app/main:/app/main'
      - '../tol-sdk:/packages/tol-sdk:rw'

  tolid-api-test:
    build: 
      context: tolid-api
      dockerfile: Dockerfile.test
    command: pytest -vvvx test
    volumes:
      - './tolid-api/app/main:/app/main'
      - '../tol-sdk:/packages/tol-sdk:rw'

  tolid-ui:
    build:
      context: tolid-ui/.
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - REACT_APP_API_PATH=${API_PATH}
      - REACT_APP_API_DATA_PATH=${API_DATA_PATH}
      - REACT_APP_API_CUSTOM_PATH=${API_CUSTOM_PATH}
      - REACT_APP_API_SYSTEM_PATH=${API_SYSTEM_PATH}
      - REACT_APP_API_AUTH_PATH=${API_AUTH_PATH}
      - REACT_APP_PORTAL_URL=${PORTAL_URL}
      - REACT_APP_PORTAL_API_PATH=${PORTAL_API_PATH}
      - REACT_APP_PORTAL_API_DATA_PATH=${PORTAL_API_DATA_PATH}
      - REACT_APP_BOARDS_API_DATA_PATH=${BOARDS_API_DATA_PATH}
      - REACT_APP_MATOMO_SITE_ID=${MATOMO_SITE_ID}
      - LOCAL_TOLUI=${LOCAL_TOLUI}
    ports:
      - "3002:3000"
    volumes:
      - './tolid-ui/app:/usr/src/app'
      - '/usr/src/app/node_modules'
      - '../components/components-ui/app/src/tol-ui:/usr/src/app/src/tol-ui'
    
  tolid-apiv2-test:
    build: 
      context: tolid-apiv2.
      dockerfile: Dockerfile.dev
    command: dockerize
        -wait tcp://tolid-db:5432 -timeout 10s
        bash -c "pytest -v"
    environment:
      - DB_URI
      - TOLID_URL
      - ELIXIR_CLIENT_ID
      - ELIXIR_CLIENT_SECRET
      - ELIXIR_REDIRECT_URI
      - ELIXIR_JWK
      - MAIL_SENDER
      - MAIL_SENDER_NAME
      - MAIL_USERNAME_SMTP
      - MAIL_PASSWORD_SMTP
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_RECEIVER_REQUESTS_PENDING
    depends_on:
      - tolid-db
      - tolid-apiv2

  tolid-ui-test:
    build: 
      context: tolid-ui
      dockerfile: Dockerfile.dev
    command: yarn test
    stdin_open: true
    environment:
      - NODE_ENV=development
    volumes:
      - './tolid-ui/app:/usr/src/app'
      - '/usr/src/app/node_modules'

  tolid-alembic:
    build: 
      context: tolid-api/.
      dockerfile: Dockerfile.dev
    working_dir: /migrations
    environment:
      - DB_URI
    volumes:
      - './tolid-api/migrations/alembic/versions:/migrations/alembic/versions'

  tolid-dbutils:
    image: gitlab-registry.internal.sanger.ac.uk/tol/tol-core/dbutils:1.0.10
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT
      - BACKUP_S3_URI
      - BACKUP_S3_ACCESS_KEY
      - BACKUP_S3_SECRET_KEY
      - BACKUP_S3_BUCKET
      - BACKUP_S3_SECURE
      - BACKUP_SCHEDULE
      - RESTORE_FILE_PREFIX
      - FLASK_ENV

  tolid-python-db:
    image: postgres:14
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test-db
  
  tolid-python-unit-test:
    build:
      context: tolid-api
      dockerfile: Dockerfile.test
    command: pytest -v unit

  tolid-python-system-test:
    build:
      context: tolid-api
      dockerfile: Dockerfile.test
    command: pytest -v system
    environment:
      - DB_URI=postgresql://test-user:test-password@tolid-python-db:5432/test-db
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_REDIRECT_URI
      - OIDC_AUTH_URL
      - OIDC_USER_INFO_URL
      - OIDC_TOKEN_URL
      - OIDC_REVOKE_TOKEN_URL
      - GOAT_URL
      - GOAT_API_PATH
    depends_on:
      - tolid-python-db
