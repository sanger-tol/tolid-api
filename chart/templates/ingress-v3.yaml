{{- if .Values.tolcore.ingress.enabled -}}
{{- if and .Values.tolcore.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.tolcore.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.tolcore.ingress.annotations "kubernetes.io/ingress.class" .Values.tolcore.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: tolid-v3-api-ingress
  annotations:
  {{- with .Values.tolcore.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
    revision: "{{ .Release.Revision }}"
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

spec:
  {{- if and .Values.tolcore.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.tolcore.ingress.className }}
  {{- end }}
  rules:
    - host: {{ (urlParse .Values.tolcore.deployment.environment_url).host | quote }}
      http:
        paths:
          - path: /api/v3
            pathType: Prefix
            backend:
              service:
                name: tolid-apiv3-svc
                port:
                  number: 80
{{- end }}
