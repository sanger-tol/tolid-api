# Default values for tolid-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

tolcore:
  imagePullSecrets:
    - name: gitlab-registry-tol-platforms-tolid

  app:
    name: tolid

  replicaCount: 1

  image:
    repository: ""
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: "serviceaccount"

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true  # every deployment has a domain name
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  job:
    restartPolicy: "OnFailure"

  deployment:
    environment: "dev"
  db:
    enabled: true
    fullname: "tolid-db"
    user: "tolid"
    password: "tolid"
    name: "tolid"
  dbutils:
    image:
      repository: ""
      tag: "1.0.4"
  schemaspy:
    enabled: false  # disable schemaspy (there is no DB to spy on)
    image:
      repository: ""
      tag: ""
  api:
    fullname: "tolid-api"
    probe_url: '/api/v1/system/healthz'
    path: '/api/v1'
    token: ""
    extra_env:
      API_PATH: api.path
      API_TOKEN: api.token
      ELASTIC_URI: elastic.uri
      ELASTIC_USER: elastic.user
      ELASTIC_PASSWORD: elastic.password
      ELASTIC_INDEX_PREFIX: elastic.index_prefix
  flask:
    env: ""
  ui:
    fullname: "tolid-ui"
    probe_url: '/'
    matomo_site_id: ''
    extra_env:
      REACT_APP_API_PATH: api.path
      REACT_APP_PORTAL_URL: portal.url
      REACT_APP_PORTAL_API_PATH: portal.api_path
      REACT_APP_MATOMO_SITE_ID: ui.matomo_site_id
  backup:
    schedule: ""
    uri: ""
    access_key: ""
    secret_key: ""
    bucket: ""
    secure: ""
  restore:
    prefix: "tolid_prod"
  portal:
    url: ""
    api_path: ""
  oidc:
    enabled: true
